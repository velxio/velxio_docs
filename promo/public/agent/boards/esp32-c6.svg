<svg xmlns="http://www.w3.org/2000/svg" width="127" height="275" viewBox="0 0 127 275">
  <!-- ESP32-C6-DevKitC-1 (25.4 x 55 mm at 5 px/mm). Pin pads at x=7 / x=120,
       rows y=38..229 (2.54 mm pitch) - keep in sync with PINS_ESP32_C6 in
       frontend/src/components/velxio-components/Esp32Element.ts -->

  <!-- PCB -->
  <rect x="0.5" y="0.5" width="126" height="274" rx="5" fill="#3e3e3e" stroke="#030303" stroke-width="0.8"/>

  <!-- ESP32-C6-WROOM-1 module -->
  <rect x="24" y="3" width="79" height="64" rx="2" fill="#9a9a9a" stroke="#5f5f5f" stroke-width="0.8"/>
  <!-- antenna zone -->
  <rect x="26" y="5" width="75" height="16" fill="#262626"/>
  <path d="M29 8 v10 h8 v-10 h8 v10 h8 v-10 h8 v10 h8 v-10 h8 v10 h8 v-10 h8 v10"
        fill="none" stroke="#c49a6c" stroke-width="1.6"/>
  <!-- shield body -->
  <rect x="26" y="23" width="75" height="42" fill="#b5b5b5" stroke="#7a7a7a" stroke-width="0.6"/>
  <text x="63.5" y="41" font-family="Arial, sans-serif" font-size="9" font-weight="bold"
        fill="#3c3c3c" text-anchor="middle">ESP32-C6</text>
  <text x="63.5" y="52" font-family="Arial, sans-serif" font-size="6.5"
        fill="#4a4a4a" text-anchor="middle">WROOM-1</text>

  <!-- board title silkscreen -->
  <text x="63.5" y="76" font-family="Arial, sans-serif" font-size="5.4"
        fill="#e8e8e8" text-anchor="middle">ESP32-C6-DevKitC-1</text>

  <!-- RGB LED (WS2812 on GPIO8) -->
  <rect x="58" y="196" width="11" height="11" rx="1.5" fill="#f4f4f4" stroke="#9a9a9a" stroke-width="0.6"/>
  <circle cx="63.5" cy="201.5" r="2.6" fill="#d9d9d9"/>
  <text x="63.5" y="215" font-family="Arial, sans-serif" font-size="4.6"
        fill="#e8e8e8" text-anchor="middle">RGB</text>

  <!-- RST / BOOT buttons -->
  <g>
    <rect x="18" y="234" width="17" height="14" rx="1.5" fill="#c7c7c7" stroke="#8a8a8a" stroke-width="0.6"/>
    <circle cx="26.5" cy="241" r="3.6" fill="#efefef" stroke="#9a9a9a" stroke-width="0.6"/>
    <text x="26.5" y="256" font-family="Arial, sans-serif" font-size="4.6"
          fill="#e8e8e8" text-anchor="middle">RST</text>
  </g>
  <g>
    <rect x="92" y="234" width="17" height="14" rx="1.5" fill="#c7c7c7" stroke="#8a8a8a" stroke-width="0.6"/>
    <circle cx="100.5" cy="241" r="3.6" fill="#efefef" stroke="#9a9a9a" stroke-width="0.6"/>
    <text x="100.5" y="256" font-family="Arial, sans-serif" font-size="4.6"
          fill="#e8e8e8" text-anchor="middle">BOOT</text>
  </g>

  <!-- USB-C connectors (UART bridge + native USB) -->
  <rect x="38" y="261" width="24" height="14" rx="3" fill="#b8b8b8" stroke="#7a7a7a" stroke-width="0.7"/>
  <rect x="66" y="261" width="24" height="14" rx="3" fill="#b8b8b8" stroke="#7a7a7a" stroke-width="0.7"/>

  <!-- pin pads -->
  <g stroke="#8a6d1f" stroke-width="0.5">
    <g fill="#e6b93c">
      <circle cx="7" cy="38" r="3.4"/><circle cx="7" cy="51" r="3.4"/><circle cx="7" cy="64" r="3.4"/>
      <circle cx="7" cy="76" r="3.4"/><circle cx="7" cy="89" r="3.4"/><circle cx="7" cy="102" r="3.4"/>
      <circle cx="7" cy="115" r="3.4"/><circle cx="7" cy="127" r="3.4"/><circle cx="7" cy="140" r="3.4"/>
      <circle cx="7" cy="153" r="3.4"/><circle cx="7" cy="166" r="3.4"/><circle cx="7" cy="178" r="3.4"/>
      <circle cx="7" cy="191" r="3.4"/><circle cx="7" cy="203" r="3.4"/><circle cx="7" cy="216" r="3.4"/>
      <circle cx="7" cy="229" r="3.4"/>
      <circle cx="120" cy="38" r="3.4"/><circle cx="120" cy="51" r="3.4"/><circle cx="120" cy="64" r="3.4"/>
      <circle cx="120" cy="76" r="3.4"/><circle cx="120" cy="89" r="3.4"/><circle cx="120" cy="102" r="3.4"/>
      <circle cx="120" cy="115" r="3.4"/><circle cx="120" cy="127" r="3.4"/><circle cx="120" cy="140" r="3.4"/>
      <circle cx="120" cy="153" r="3.4"/><circle cx="120" cy="166" r="3.4"/><circle cx="120" cy="178" r="3.4"/>
      <circle cx="120" cy="191" r="3.4"/><circle cx="120" cy="203" r="3.4"/><circle cx="120" cy="216" r="3.4"/>
      <circle cx="120" cy="229" r="3.4"/>
    </g>
  </g>
  <g fill="#3a3a3a">
    <circle cx="7" cy="38" r="1.4"/><circle cx="7" cy="51" r="1.4"/><circle cx="7" cy="64" r="1.4"/>
    <circle cx="7" cy="76" r="1.4"/><circle cx="7" cy="89" r="1.4"/><circle cx="7" cy="102" r="1.4"/>
    <circle cx="7" cy="115" r="1.4"/><circle cx="7" cy="127" r="1.4"/><circle cx="7" cy="140" r="1.4"/>
    <circle cx="7" cy="153" r="1.4"/><circle cx="7" cy="166" r="1.4"/><circle cx="7" cy="178" r="1.4"/>
    <circle cx="7" cy="191" r="1.4"/><circle cx="7" cy="203" r="1.4"/><circle cx="7" cy="216" r="1.4"/>
    <circle cx="7" cy="229" r="1.4"/>
    <circle cx="120" cy="38" r="1.4"/><circle cx="120" cy="51" r="1.4"/><circle cx="120" cy="64" r="1.4"/>
    <circle cx="120" cy="76" r="1.4"/><circle cx="120" cy="89" r="1.4"/><circle cx="120" cy="102" r="1.4"/>
    <circle cx="120" cy="115" r="1.4"/><circle cx="120" cy="127" r="1.4"/><circle cx="120" cy="140" r="1.4"/>
    <circle cx="120" cy="153" r="1.4"/><circle cx="120" cy="166" r="1.4"/><circle cx="120" cy="178" r="1.4"/>
    <circle cx="120" cy="191" r="1.4"/><circle cx="120" cy="203" r="1.4"/><circle cx="120" cy="216" r="1.4"/>
    <circle cx="120" cy="229" r="1.4"/>
  </g>

  <!-- silkscreen pin labels: left column (J1) -->
  <g font-family="Arial, sans-serif" font-size="5.6" fill="#e8e8e8" text-anchor="start">
    <text x="13" y="40">3V3</text>
    <text x="13" y="53">RST</text>
    <text x="13" y="66">4</text>
    <text x="13" y="78">5</text>
    <text x="13" y="91">6</text>
    <text x="13" y="104">7</text>
    <text x="13" y="117">0</text>
    <text x="13" y="129">1</text>
    <text x="13" y="142">8</text>
    <text x="13" y="155">10</text>
    <text x="13" y="168">11</text>
    <text x="13" y="180">2</text>
    <text x="13" y="193">3</text>
    <text x="13" y="205">5V</text>
    <text x="13" y="218">G</text>
    <text x="13" y="231">NC</text>
  </g>

  <!-- silkscreen pin labels: right column (J3) -->
  <g font-family="Arial, sans-serif" font-size="5.6" fill="#e8e8e8" text-anchor="end">
    <text x="114" y="40">G</text>
    <text x="114" y="53">TX</text>
    <text x="114" y="66">RX</text>
    <text x="114" y="78">15</text>
    <text x="114" y="91">23</text>
    <text x="114" y="104">22</text>
    <text x="114" y="117">21</text>
    <text x="114" y="129">20</text>
    <text x="114" y="142">19</text>
    <text x="114" y="155">18</text>
    <text x="114" y="168">9</text>
    <text x="114" y="180">G</text>
    <text x="114" y="193">13</text>
    <text x="114" y="205">12</text>
    <text x="114" y="218">G</text>
    <text x="114" y="231">NC</text>
  </g>
</svg>
